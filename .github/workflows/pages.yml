name: Deploy forest to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check game.js
          node --check nature.js
          node --check realAnimals.js
          node --check server.mjs
          node --check performance.js
          node --check water.js
          node --check water-map.js
          node --check quests.js
          node --check animal-library.js
          node --check animal-behavior.js
          node --check abilities.js
          node --check ability-world.js
          node --check rescue-quest.js
          node --check minimap.js
          node --check melody-quest.js
          node --check world-quests.js
          node --check movement-rules.js
          node --check diagnostics.js
      - name: Prepare static game
        run: |
          mkdir _site
          cp index.html style.css game.js nature.js realAnimals.js performance.js water.js water-map.js quests.js animal-library.js animal-behavior.js abilities.js ability-world.js rescue-quest.js minimap.js melody-quest.js world-quests.js movement-rules.js diagnostics.js _site/
          cp -R vendor models textures _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
